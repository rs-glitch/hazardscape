<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hazard Replays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: header with fire tabs; scene (3D or state map) beside a stats panel; timeline under the scene. Phone: stacked. */
:root {
  color-scheme: dark;
  --bg: #101416;        /* night ground */
  --panel: #171d20;
  --line: #2b3438;
  --fg: #ebe5da;        /* ash white */
  --muted: #9ba5a8;
  --fire: #ff7a1a;      /* active front */
  --ember: #ffc04d;
  --scar: #6b3524;      /* burned ground */
  --sky: #8fb3d1;       /* weather lines */
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.app { display: grid; grid-template: "head head" auto "scene panel" 1fr "time panel" auto / minmax(0, 1fr) 380px; height: 100%;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
header { grid-area: head; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) 8px; border-bottom: 1px solid var(--line); }
h1 { font: 700 26px/1 var(--display); letter-spacing: .02em; margin: 0; }
h1 span { color: var(--fire); }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
#cats button:disabled { opacity: .45; cursor: default; }
.tip.qtoast { left: 50%; top: 14px; transform: translateX(-50%); max-width: min(520px, 90%); text-align: center; }
nav button { background: none; border: 1px solid transparent; border-radius: 4px; padding: 3px 9px; cursor: pointer;
  font: 600 16px/1.2 var(--display); letter-spacing: .03em; color: var(--muted); }
nav button:hover { color: var(--fg); border-color: var(--line); }
nav button[aria-pressed="true"] { color: var(--bg); background: var(--fg); }
nav button small { font-weight: 500; opacity: .7; margin-left: 3px; }
.scene { grid-area: scene; position: relative; min-height: 0; min-width: 0; overflow: hidden; }
.scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.labels div { position: absolute; transform: translate(-50%, -130%); font: 600 13px/1 var(--display); letter-spacing: .04em;
  color: var(--fg); text-shadow: 0 0 3px #000, 0 0 6px #000; white-space: nowrap; }
.labels div.gauge { color: #e8eef3; font-size: 11px; background: rgba(12,18,24,.72); border-radius: 4px; padding: 3px 5px 2px; text-shadow: none; }
.labels div.gauge i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.labels div.gauge svg { display: block; margin-top: 2px; }
.labels div.gauge.dim { opacity: .45; }
.labels div.gauge small { display: block; font: 500 10px/1.2 var(--body, system-ui); color: #b9c6d0; margin-top: 2px; letter-spacing: 0; }
.labels div.res { color: #e8eef3; font-size: 10px; background: rgba(12,18,24,.66); border-radius: 4px; padding: 3px 6px; text-shadow: none; }
.labels div.res b { display: block; font-size: 11px; margin-top: 1px; font-variant-numeric: tabular-nums; }
.labels div.res .bar { display: block; position: relative; width: 44px; height: 3px; margin-top: 3px; border-radius: 2px; background: rgba(255,255,255,.14); }
.labels div.res .bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #4ea3d8; }
.labels div.res .bar em { position: absolute; top: -2px; width: 2px; height: 8px; background: #f2f2f2; }
table.lag { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.lag th, table.lag td { text-align: left; padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
table.lag th { color: var(--muted); font-weight: 500; }
.lagbar { display: inline-block; height: 6px; border-radius: 3px; background: #9fc3e6; margin-right: 6px; vertical-align: 1px; }
.sponge { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.sponge svg { width: 100%; height: auto; }
.slegend { position: absolute; right: 12px; bottom: 32px; pointer-events: none; font-size: 11px; color: var(--fg);
  background: rgba(10,14,18,.66); border-radius: 6px; padding: 6px 8px; max-width: min(360px, calc(100% - 24px)); text-shadow: none; }
.slegend .row { display: flex; gap: 3px; flex-wrap: wrap; }
.slegend .row span { display: flex; flex-direction: column; align-items: center; min-width: 42px; }
.slegend .row b { display: block; width: 100%; height: 8px; border-radius: 2px; }
.slegend .row em { font-style: normal; color: var(--muted); font-size: 10px; margin-top: 2px; }
.slegend p { margin: 4px 0 0; color: var(--muted); font-size: 10px; line-height: 1.3; }
@media (max-width: 700px) { .slegend p { display: none; } .slegend { bottom: 28px; padding: 4px 6px; } }
.slegend .hatch { display: inline-block; width: 14px; height: 8px; vertical-align: -1px; border-radius: 2px;
  background: repeating-linear-gradient(135deg, #3a7cc4 0 2px, rgba(58,124,196,.35) 2px 4px); }
.gcard { border-top: 1px solid var(--line); padding-top: 8px; }
.labels div.cdp { font-weight: 500; color: #d5cfc4; font-size: 12px; }
.hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none;
  text-shadow: 0 0 4px #000; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: var(--bg); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 8px; font-size: 13px; max-width: 240px; }
.timeline { grid-area: time; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-top: 1px solid var(--line); background: var(--panel); }
.timeline input[type=range] { flex: 1; min-width: 0; accent-color: var(--fire); }
#play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fire); color: #1a0d05; cursor: pointer;
  font-size: 16px; flex: none; }
.timeline select { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
aside { grid-area: panel; border-left: 1px solid var(--line); overflow-y: auto; min-width: 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px 16px; display: flex; flex-direction: column; gap: 16px; }
.when { font: 600 24px/1.1 var(--display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 13px; }
.note { font-size: 14px; color: #cfc8bc; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kpi b { display: block; font: 600 26px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi.hot b { color: var(--ember); }
h2 { font: 600 15px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.chart svg { display: block; width: 100%; height: auto; cursor: pointer; touch-action: none; }
.chart text { fill: var(--muted); font: 11px var(--body); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); }
.chart .cur { stroke: var(--fg); stroke-width: 1; }
.readout { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--fg); }
.stack { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--line); gap: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.wind { display: flex; align-items: center; gap: 12px; }
.wind svg { flex: none; }
.ctl { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.ctl input[type=range] { width: 110px; accent-color: var(--fg); }
.cap { position: absolute; left: 12px; right: 12px; top: 10px; max-width: 560px; background: rgba(15,19,21,.82); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 14px; pointer-events: none; }
.more > summary { cursor: pointer; font: 700 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
.more { display: flex; flex-direction: column; gap: 16px; }
.more > summary { margin-bottom: 4px; }
.mom { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.mom h2 { margin: 0; }
.mom .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mom button { font: 600 13px/1.2 var(--display); letter-spacing: .02em; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 5px 10px; cursor: pointer; min-height: 32px; }
.mom button:hover, .mom button[aria-pressed=true] { border-color: var(--ember); }
.mom dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
.mom dt { color: var(--muted); } .mom dd { margin: 0; font-variant-numeric: tabular-nums; }
.mom .src { color: var(--muted); font-size: 12px; }
.chip { display: inline-block; font: 700 10px/1 var(--display); letter-spacing: .08em; padding: 2px 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
.chip.model { background: #6b3a00; border-color: #ffb347; color: #ffd9a0; }
.chip.meas { border-color: #6fbf8a; color: #a9e3bd; }
.lessons { margin: 0; padding-left: 18px; font-size: 13px; color: #cfc8bc; } .lessons li { margin: 4px 0; }
details { border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; color: var(--fg); font: 600 15px var(--display); letter-spacing: .04em; }
details li { margin: 4px 0; }
details a { color: var(--sky); }
.years { display: flex; flex-wrap: wrap; gap: 4px; }
.years button { border: 1px solid var(--line); background: none; border-radius: 3px; padding: 2px 8px; cursor: pointer; font-size: 13px; }
.years button[aria-pressed="true"] { border-color: var(--fg); }
.years i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.flist { display: grid; gap: 6px; }
.flist button { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; cursor: pointer; }
.flist button:hover { border-color: var(--fire); }
.flist b { font: 600 17px var(--display); letter-spacing: .02em; }
.flist span { color: var(--muted); font-size: 13px; display: block; }
@media (max-width: 860px) {
  .app { grid-template: "head" auto "scene" 56vh "time" auto "panel" auto / minmax(0, 1fr); height: auto; }
  aside { border-left: 0; overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Hazard <span>Replays</span></h1>
    <nav id="cats" aria-label="Choose a hazard"></nav>
    <nav id="tabs" aria-label="Choose an event"></nav>
  </header>
  <div class="scene" id="scene">
    <canvas id="gl" aria-label="3D terrain with the fire spread"></canvas>
    <canvas id="map" hidden aria-label="Map of California fire perimeters"></canvas>
    <div class="labels" id="labels"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="hint" id="hint"></div>
    <div class="slegend" id="slegend" hidden></div>
    <div class="cap" id="cap" hidden></div>
    <div class="overlay" id="loading" hidden>Loading data…</div>
    <div class="tip qtoast" id="qtoast" hidden role="status"></div>
  </div>
  <div class="timeline" id="timeline" hidden>
    <button id="play" aria-label="Play">▶</button>
    <label for="t" class="sub" style="position:absolute;left:-9999px">Replay time</label>
    <input id="t" type="range" min="0" max="100" step="0.1" value="0">
    <label class="sub" for="speed">Speed</label>
    <select id="speed"><option value="6">6 h/s</option><option value="12" selected>12 h/s</option><option value="24">1 day/s</option><option value="48">2 days/s</option><option value="168">1 week/s</option></select>
  </div>
  <aside id="panel"></aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const $ = (s) => document.querySelector(s);
const fmt = (v, d = 0) => (v == null || Number.isNaN(v) ? "–" : v.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d }));
// names and notes come from agency feeds: escape before they go into innerHTML
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const LC = [["forest", "Forest", "#4f8a45"], ["shrub", "Shrub", "#a3a066"], ["grass", "Grass", "#cfc690"],
  ["developed", "Developed", "#aa9d90"], ["agriculture", "Farmland", "#c9ad6c"], ["other", "Water, wetland, bare", "#6f8fa8"]];
const YEAR_COL = { 2020: "#7a2e1a", 2021: "#a03d1c", 2022: "#c0531f", 2023: "#d96b2b", 2024: "#ec8a3c", 2025: "#f5ac5a", 2026: "#fad08a" };
const tz = new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", weekday: "short", month: "short",
  day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
const dayFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", month: "short", day: "numeric" });

const S = { view: "state", cat: "fire", fire: null, fireId: null, seq: 0, T: 0, playing: false, speed: 12, year: "all", sources: null };
const CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let state = null;

// ---------- shared ----------
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`); return r.json(); }
async function getBin(u, T) {   // binary arrays ship as base64 text
  const r = await fetch(u); if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`);
  const s = atob((await r.text()).trim()), b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return new T(b.buffer);
}

const HAZ = [["fire", "🔥 Fires"], ["quake", "🌐 Earthquakes"], ["hurricane", "🌀 Hurricanes"], ["flood", "🌊 Floods"], ["drought", "🏜 Drought"]];
const EVENTS = { hurricane: [{ id: "helene", name: "Helene", year: 2024 }], flood: [{ id: "helene-wnc", name: "Western NC", year: 2024 }], quake: [{ id: "ridgecrest", name: "Ridgecrest", year: 2019 }], drought: [{ id: "ca-drought", name: "California", year: "2020–23" }] };
function tabs() {
  const cats = $("#cats"); cats.innerHTML = "";
  for (const [k, label] of HAZ) {
    const b = document.createElement("button"), ready = k === "fire" || EVENTS[k];
    b.innerHTML = esc(label) + (ready ? "" : "<small>soon</small>"); b.disabled = !ready; b.setAttribute("aria-pressed", S.cat === k);
    b.onclick = () => { S.cat = k; k === "fire" ? showState() : showFire(EVENTS[k][0].id); };
    cats.append(b);
  }
  const nav = $("#tabs");
  nav.innerHTML = "";
  const mk = (label, sub, on, pressed) => {
    const b = document.createElement("button");
    b.innerHTML = esc(label) + (sub ? `<small>${esc(sub)}</small>` : "");
    b.setAttribute("aria-pressed", pressed);
    b.onclick = on;
    nav.append(b);
  };
  if (S.cat !== "fire") { for (const f of EVENTS[S.cat]) mk(f.name, f.year, () => showFire(f.id), S.fireId === f.id); return; }
  mk("Statewide", "2020–26", () => showState(), S.view === "state");
  for (const f of state.featured) mk(f.name.replace(" Fire", ""), f.year, () => showFire(f.id), S.view === "fire" && S.fireId === f.id);
}

// ---------- SVG charts with a shared time cursor ----------
function chart(box, { xs, ys, ys2, type = "line", color, xmax, fmtY = (v) => fmt(v), label, xTicks, ymin = 0 }) {
  const W = 340, H = 92, L = 34, R = 6, T = 8, B = 18;
  const ymax = ymin + Math.max(1e-9, Math.max(...ys.filter((v) => v != null)) - ymin) * 1.05, span = (ymax - ymin) / 1.05;
  const X = (x) => L + (x / xmax) * (W - L - R), Y = (y) => T + (1 - (y - ymin) / (ymax - ymin)) * (H - T - B);
  let marks = "";
  if (type === "bar") {
    const bw = Math.max(1, (W - L - R) / xs.length - 1);
    xs.forEach((x, i) => { if (ys[i] > 0) marks += `<rect x="${X(x) - bw}" y="${Y(ys[i])}" width="${bw}" height="${Y(ymin) - Y(ys[i])}" fill="${color}" rx="1"/>`; });
  } else {
    const pts = xs.map((x, i) => (ys[i] == null ? null : `${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`)).filter(Boolean);
    if (type === "area") marks += `<path d="M${X(xs[0])},${Y(ymin)}L${pts.join("L")}L${X(xs[xs.length - 1])},${Y(ymin)}Z" fill="${color}" opacity=".18"/>`;
    marks += `<path d="M${pts.join("L")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  if (ys2) { const m2 = Math.max(1e-9, ...ys2.filter((v) => v != null)), p2 = xs.map((x, i) => (ys2[i] == null ? null : `${X(x).toFixed(1)},${Y(ymin + (ys2[i] / m2) * span).toFixed(1)}`)).filter(Boolean); marks += `<path d="M${p2.join("L")}" fill="none" stroke="#ebe5da" stroke-width="1.2" stroke-dasharray="3 2" opacity=".75"/>`; }
  let grid = "";
  for (const f of [0, 0.5, 1]) {
    const v = ymin + span * f;
    grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 4}" y="${Y(v) + 4}" text-anchor="end">${fmtY(v)}</text>`;
  }
  for (const [x, t] of xTicks) grid += `<text x="${X(x)}" y="${H - 4}" text-anchor="${X(x) > W - 16 ? "end" : "middle"}">${t}</text>`;
  box.innerHTML = `<h2>${label}</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${grid}${marks}<line class="cur" y1="${T}" y2="${H - B}"/></svg><div class="readout"></div>`;
  const svg = box.querySelector("svg"), cur = box.querySelector(".cur");
  const seek = (e) => { const r = svg.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width) * W;
    if (S.view === "fire") stop(); setT(Math.max(0, Math.min(xmax, ((x - L) / (W - L - R)) * xmax))); if (S.fire?.quake) quakeSync(S.T, true); };
  svg.addEventListener("pointerdown", (e) => { seek(e); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove", (e) => { if (e.buttons) seek(e); });
  return { move: (t) => { const x = X(t); cur.setAttribute("x1", x); cur.setAttribute("x2", x); }, readout: box.querySelector(".readout") };
}

// ---------- statewide view ----------
async function showState() {
  stop();
  S.view = "state"; S.fire = null; S.fireId = null; S.seq++;
  $("#loading").hidden = true;
  tabs();
  $("#gl").hidden = true; $("#map").hidden = false; $("#timeline").hidden = true; $("#labels").innerHTML = ""; $("#slegend").hidden = true; S.camTw = null;
  $("#hint").textContent = "Hover a perimeter for details. Click a highlighted fire to replay it in 3D.";
  const inc = state.incidents, per = state.perimeters;
  const yrs = Object.keys(state.acres_by_year);
  const big = per.filter((p) => S.year === "all" || p.y == S.year);
  const nInc = inc.filter((d) => S.year === "all" || d.y == S.year).length;
  const panel = $("#panel");
  panel.innerHTML = `
    <div><div class="when">California wildfires, 2020–2026</div>
    <p class="note">Every final fire perimeter over 1,000 acres since 2020, coloured by year. ${fmt(nInc)} CAL FIRE-listed wildfire incidents in this selection.</p></div>
    <div><h2>Year</h2><div class="years" id="years"></div></div>
    <div class="chart" id="c-acres"></div>
    <div class="chart" id="c-det"></div>
    <div><h2>Replay a fire in 3D</h2><div class="flist" id="flist"></div></div>
    <div><h2>Largest in selection</h2><ol class="sub" id="top" style="margin:0;padding-left:20px"></ol></div>
    ${sourcesHTML()}`;
  const yb = $("#years");
  for (const y of ["all", ...yrs]) {
    const b = document.createElement("button");
    b.innerHTML = (y === "all" ? "" : `<i style="background:${YEAR_COL[y]}"></i>`) + (y === "all" ? "All years" : y);
    b.setAttribute("aria-pressed", S.year == y);
    b.onclick = () => { S.year = y; showState(); };
    yb.append(b);
  }
  // acres per year (sum of CAL FIRE-reported acres)

function droughtSetT(T) {
  const meta = S.fire.meta, d = droughtStat(T), W = meta.wells, BK = meta.bucket, GR = meta.grace;
  DR.u.uWeek.value = Math.min(DR.nW - 1, T / 168);
  $("#when").textContent = new Date(Date.parse(meta.t0) + T * 3600e3).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
  $("#dayn").textContent = `Week ${Math.floor(T / 168) + 1} of ${meta.weeks.length}`;
  $("#d-d2").textContent = fmt(d.d2, 0) + " %"; $("#d-d4").textContent = fmt(d.d4, 0) + " %";
  const ex = [100 - d.d0, d.d0 - d.d1, d.d1 - d.d2, d.d2 - d.d3, d.d3 - d.d4, d.d4];
  $("#dstack").innerHTML = ex.map((v, i) => `<div style="width:${Math.max(0, v)}%;background:${DCOL[i][1]}"></div>`).join("");
  const kf = Math.min(DR.nW - 1, T / 168), k0 = Math.floor(kf), k1 = Math.min(DR.nW - 1, k0 + 1), fr = kf - k0;
  const at = (r) => (r.acft[k0] == null ? null : r.acft[k0] + ((r.acft[k1] ?? r.acft[k0]) - r.acft[k0]) * fr);
  if (DR.snow) { droughtSnow(T); const v = SERIES_AT(meta.snow.index.map((x) => x ?? 0), T), raw = meta.snow.index[Math.round(Math.min(DR.nW - 1, T / 168))];
    $("#d-sn").textContent = raw == null ? "no snow" : fmt(v, 0) + " %"; S.fire.charts.sn.readout.textContent = raw == null ? "too little snow at the sites for a median (summer and autumn)" : `${fmt(v, 0)} % of median at the SNOTEL sites`; }
  if (DR.rainS) { droughtRain(T); const v = SERIES_AT(meta.rain.state, T); $("#d-rn").textContent = fmt(v, 0) + " mm"; S.fire.charts.rn.readout.textContent = `${fmt(v, 0)} mm in the week to this date`; }
  const rp = RES_PCT(meta); if (rp) { const v = SERIES_AT(rp.map((x) => x ?? 0), T); $("#d-rv").textContent = fmt(v, 0) + " %"; S.fire.charts.rv.readout.textContent = `${fmt(v, 0)} % of average for the date: ${meta.reservoirs.map((r) => r.name.replace(/ (Lake|Reservoir)$/, "").replace(/^Lake /, "")).join(", ")}`; }
  for (const c of Object.values(S.fire.charts)) c.move(T);
  S.fire.charts.d2.readout.textContent = `${fmt(d.d2, 1)} % of the state in D2 or worse`;
  S.fire.charts.d34.readout.textContent = `${fmt(d.d3, 1)} % in D3 or worse · ${fmt(d.d4, 1)} % in D4`;
  meta.reservoirs.slice(0, 2).forEach((r, i) => { const v = at(r); S.fire.charts["r" + i].readout.textContent = v == null ? "" : `${fmt(Math.round(v / 100) * 100)} acre-feet · ${fmt((100 * v) / (r.cap_acft || r.max_acft))} % of its record maximum`; });
  const wv = SERIES_AT(W.med_valley, T);
  droughtTanks(T); droughtLayers(T);
  for (const L of S.fire.lab) {   // reservoir cards: % of the average for the date; bar = storage against record, tick = the average
    if (L.p.kind !== "res") continue;

    L.el.querySelector("b").textContent = t.avgNow ? `${fmt((100 * t.now) / t.avgNow, 0)} % of avg` : fmt(t.now / 1e6, 2) + " M acre-ft";
    L.el.querySelector(".bar span").style.width = `${Math.min(100, (100 * t.now) / top)}%`;
    const em = L.el.querySelector(".bar em"); em.hidden = !t.avgNow; if (t.avgNow) em.style.left = `${Math.min(100, (100 * t.avgNow) / top)}%`;
  }
  const nl = DR.chg ? DR.chg.filter((c) => c > 0).length : 0;
  S.fire.charts.w.readout.textContent = `${wv >= 0 ? "+" : "−"}${fmt(Math.abs(wv), 1)} ft Central Valley median · ${nl} of ${W.items.length} wells deeper than their own 2020 median`;
  S.fire.charts.s.readout.textContent = `${fmt(SERIES_AT(BK.state_S, T), 0)} % full (model)`;
  S.fire.charts.g.readout.textContent = `${fmt(SERIES_AT(GR.state, T), 0)}th percentile (state mean)`;
  // in-scene legend: USDM classes (official colours) with this week's share of the state
  if (DR.u.uMode.value === 0) $("#slegend").innerHTML = `<div class="row">${DCOL.slice(1).map(([n, c], k) => `<span title="${esc(n)}"><b style="background:${c}"></b><em>D${k} ${fmt(Math.max(0, ex[k + 1]), 0)}%</em></span>`).join("")}</div>
    <p>Share of California this week (US Drought Monitor). Browning and cracks follow each county's drought index; they are a visual code, not mapped cracks.${DR.dust?.visible ? " Dust: illustrative." : ""}</p>`;

  }
}

// earth-coloured walls around the terrain block, so it reads as a model
function skirtMesh(W, H) {
  const edge = [];
  for (let x = 0; x < W; x++) edge.push(x);
  for (let y = 1; y < H; y++) edge.push(y * W + W - 1);
  for (let x = W - 2; x >= 0; x--) edge.push((H - 1) * W + x);
  for (let y = H - 2; y > 0; y--) edge.push(y * W);
  edge.push(0);
  const n = edge.length, v = new Float32Array(n * 6), c = new Float32Array(n * 6), idx = [];
  for (let i = 0; i < n; i++) { c.set([0.24, 0.19, 0.15, 0.09, 0.08, 0.07], i * 6); if (i < n - 1) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(v, 3));
  g.setAttribute("color", new THREE.BufferAttribute(c, 3));
  g.setIndex(idx);
  const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  mesh.update = (pos, base) => {
    for (let i = 0; i < n; i++) { const k = edge[i]; v.set([pos.getX(k), pos.getY(k), pos.getZ(k), pos.getX(k), base, pos.getZ(k)], i * 6); }
    g.attributes.position.needsUpdate = true; g.computeBoundingSphere();
  };
  return mesh;
}

// ---------- smoke and ember sparks, emitted from satellite-detected active fire, drifting with the ERA5 wind ----------
function particles(n, sceneKm, ember) {
  const pos = new Float32Array(n * 3), life = new Float32Array(n).fill(1), seed = Float32Array.from({ length: n }, Math.random);
  const vel = new Float32Array(n * 3), ttl = new Float32Array(n).fill(1);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("aLife", new THREE.BufferAttribute(life, 1));
  geo.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uScale: R.U.uScale, uSize: { value: sceneKm * (ember ? 0.0025 : 0.016) } },
    transparent: true, depthWrite: false, blending: ember ? THREE.AdditiveBlending : THREE.NormalBlending,
    vertexShader: `attribute float aLife; attribute float aSeed; uniform float uScale, uSize; varying float vL; varying float vS;
      void main(){ vL = aLife; vS = aSeed; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;
        gl_PointSize = aLife >= 1.0 ? 0.0 : max(${ember ? "2.0" : "0.0"}, uSize * ${ember ? "1.0" : "(0.6 + 3.0 * aLife)"} * uScale / -mv.z); }`,
    fragmentShader: ember
      ? `varying float vL; void main(){ float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard;
          gl_FragColor = vec4(vec3(1.0, 0.55, 0.15) * (1.0 - vL) * 1.6 * (1.0 - 2.0 * d), 1.0); }`
      : `varying float vL; varying float vS; void main(){ vec2 c = gl_PointCoord - 0.5; float d = length(c); if (d > 0.5) discard;
          float puff = smoothstep(0.5, 0.0, d) * (0.75 + 0.25 * sin(12.0 * c.x + 9.0 * c.y + vS * 30.0));
          vec3 col = mix(vec3(0.22, 0.19, 0.17), vec3(0.62, 0.61, 0.6), vL);
          gl_FragColor = vec4(col, puff * smoothstep(0.0, 0.08, vL) * (1.0 - vL) * 0.42); }`,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return { n, pos, vel, life, ttl, geo, points, ember, km: sceneKm };
}

function emitters() {   // active detections in the last 12 h, as [x, y, z, weight]
  const F = S.fire, hs = F.hs, out = [];
  for (let i = 0; i < hs.length; i += 4) {
    const age = S.T - hs[i + 2] / 10;
    if (age >= 0 && age < 12) {
      const x = hs[i] / 64, y = hs[i + 1] / 64;
      out.push([F.toX(x), F.heightAt(x, y, S.ex), F.toZ(y), Math.sqrt(hs[i + 3] / 10 + 1)]);
    }
  }
  let tot = 0;
  for (const e of out) e[3] = tot += e[3];
  return { list: out, tot, T: S.T, ex: S.ex };
}

function updateParticles(dt) {
  const F = S.fire;
  if (!F) return;
  if (!F.emit || Math.abs(F.emit.T - S.T) > 0.5 || F.emit.ex !== S.ex) F.emit = emitters();
  const E = F.emit, w = wxAt(S.T);
  const toward = ((w.dir + 180) * Math.PI) / 180;           // meteorological "from" -> direction of travel
  const drift = (w.wind / 40) * F.smoke.km * 0.012;         // visual scale: direction is real, speed is scaled
  const wx = Math.sin(toward) * drift, wz = -Math.cos(toward) * drift;
  for (const P of [F.smoke, F.embers]) {
    const rise = P.km * (P.ember ? 0.02 : 0.009);
    for (let i = 0; i < P.n; i++) {
      if (P.life[i] >= 1) {
        if (!E.list.length || Math.random() > (P.ember ? 0.06 : 0.12)) continue;
        const r = Math.random() * E.tot;
        let lo = 0, hi = E.list.length - 1;
        while (lo < hi) { const m = (lo + hi) >> 1; E.list[m][3] < r ? (lo = m + 1) : (hi = m); }
        const e = E.list[lo], j = P.km * 0.004;
        P.pos.set([e[0] + (Math.random() - 0.5) * j, e[1] + 0.02, e[2] + (Math.random() - 0.5) * j], i * 3);
        P.vel.set([(Math.random() - 0.5) * rise * 0.3, rise * (0.6 + Math.random() * 0.8), (Math.random() - 0.5) * rise * 0.3], i * 3);
        P.life[i] = 0; P.ttl[i] = P.ember ? 1.2 + Math.random() * 1.5 : 7 + Math.random() * 6;
        continue;
      }
      P.life[i] = Math.min(1, P.life[i] + dt / P.ttl[i]);
      const k = P.ember ? 1 : 0.35 + P.life[i];               // smoke catches the wind as it rises
      P.pos[i * 3] += (P.vel[i * 3] + wx * k) * dt;
      P.pos[i * 3 + 1] += P.vel[i * 3 + 1] * dt * (P.ember ? 1 : 1 - 0.6 * P.life[i]);
      P.pos[i * 3 + 2] += (P.vel[i * 3 + 2] + wz * k) * dt;
    }
    P.geo.attributes.position.needsUpdate = true;
    P.geo.attributes.aLife.needsUpdate = true;
  }
}

function interp(T) {
  const st = S.fire.meta.steps;
  let k = st.findIndex((s) => s.h >= T);
  if (k < 0) k = st.length - 1;
  const b = st[k], a = k ? st[k - 1] : { h: 0, km2: 0, cls: Object.fromEntries(LC.map(([n]) => [n, 0])) };
  const f = b.h > a.h ? Math.max(0, Math.min(1, (T - a.h) / (b.h - a.h))) : 1;
  const cls = {};
  for (const [n] of LC) cls[n] = a.cls[n] + (b.cls[n] - a.cls[n]) * f;
  return { km2: a.km2 + (b.km2 - a.km2) * f, cls, step: b };
}
function wxAt(T) {
  const w = S.fire.meta.weather;
  if (!w.h.length) return {};
  let i = w.h.findIndex((h) => h >= T); if (i < 0) i = w.h.length - 1;
  return { gust: w.wind_gusts_10m[i], wind: w.wind_speed_10m[i], dir: w.wind_direction_10m[i], rh: w.relative_humidity_2m[i], t: w.temperature_2m[i] };
}

function setT(T) {

  F.charts.rh.readout.textContent = `${fmt(w.rh)} %`;

function resize() {

  R.renderer.setSize(box.width, box.height, false);
  R.composer.setSize(box.width, box.height);
  R.U.uScale.value = box.height / (2 * Math.tan((R.camera.fov * Math.PI) / 360));
  R.camera.aspect = box.width / Math.max(1, box.height); R.camera.updateProjectionMatrix();
}

function frame() {

  const dt = Math.min(0.1, R.clock.getDelta());
  R.U.uClock.value += dt;
  if (S.playing) { const T = S.T + dt * S.speed; if (T >= S.fire.Tmax) { setT(S.fire.Tmax); stop(); } else setT(T); }
  camTick(dt);
  R.controls.update();
  if (S.fire.quake) quakeTick(dt); else if (S.fire.hur) hurTick(dt); else if (S.fire.drought) droughtTick(dt); else if (S.fire.fld) floodTick(dt); else if (!S.fire.other) updateParticles(dt);
  R.composer.render();
  if (!$("#labels").hidden) {
    const box = $("#scene").getBoundingClientRect();
    const placed = [];
    for (const L of S.fire.lab) {
      L.v.set(S.fire.toX(L.p.x), S.fire.heightAt(L.p.x, L.p.y, S.ex), S.fire.toZ(L.p.y)).project(R.camera);
      const on = L.v.z < 1 && Math.abs(L.v.x) < 1 && Math.abs(L.v.y) < 1;
      let show = on;
      if (on && (S.fire.hur || S.fire.fld || S.fire.drought)) {   // greedy declutter in priority order: skip a label that overlaps one already placed
        const gc = L.p.kind === "gauge" || L.p.kind === "res", px = ((L.v.x + 1) / 2) * box.width, py = ((1 - L.v.y) / 2) * box.height, w = gc ? Math.max(L.p.name.length * 6.2 + 22, 88) : L.p.name.length * 6.8 + 8, r = [px - w / 2, py - (gc ? 50 : 22), px + w / 2, py - 4];
        if (placed.some((q) => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) show = false; else placed.push(r);
      }
      L.el.style.display = show ? "" : "none";
      if (on) L.el.style.left = ((L.v.x + 1) / 2) * box.width + "px", L.el.style.top = ((1 - L.v.y) / 2) * box.height + "px";
    }
  }
}
// ---------- key moments, what happened, what it teaches (data/<event>/moments.json, built by pipeline/build_moments.py) ----------
async function momentsCard(id, seq) {
  let d; try { d = await getJSON(`data/${id}/moments.json`); } catch { return; }
  if (seq !== S.seq || !d.moments?.length) return;
  const panel = $("#panel"), first = panel.firstElementChild, box = document.createElement("section"); box.className = "mom";
  box.innerHTML = `<h2>What it teaches: ${esc(d.teaches.title)}</h2><div class="note">${esc(d.teaches.text)}</div>
    ${d.flag ? `<div class="note" style="color:var(--ember)">${esc(d.flag)}</div>` : ""}
    <h2>Key moments</h2><div class="chips">${d.moments.map((m, i) => `<button type="button" data-i="${i}" aria-pressed="false" title="${esc(m.src)}">${esc(m.label)}</button>`).join("")}</div>
    <div class="note" id="mom-t" aria-live="polite">Pick a moment to jump there.</div><div class="src" id="mom-s"></div>`;
  first ? first.after(box) : panel.append(box);
  // everything after the card goes under one fold, closed on phones, so the default panel is short
  const more = document.createElement("details"); more.className = "more"; more.open = innerWidth > 860;
  more.innerHTML = "<summary>Numbers, layers, charts and method</summary>";
  const kids = []; for (let n = box.nextElementSibling; n; n = n.nextElementSibling) kids.push(n);
  kids.forEach((n) => more.append(n)); box.after(more);
  const cap = $("#cap");
  box.querySelector(".chips").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return; const m = d.moments[+b.dataset.i];
    stop(); setT(Math.min(S.fire.Tmax, m.h)); if (S.fire.quake) quakeSync(S.T, true);
    box.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    $("#mom-t").textContent = m.text; $("#mom-s").textContent = "Source: " + m.src; cap.textContent = m.text; cap.hidden = false;
    try { history.replaceState(null, "", `#${id}@${m.h}`); } catch {}
  };
}

function play() { if (!S.fire) return; if (S.T >= S.fire.Tmax - 0.01) { setT(0); if (S.fire.quake) quakeSync(0, true); } S.playing = true; $("#play").textContent = "❚❚"; $("#play").setAttribute("aria-label", "Pause"); }
function stop() { S.playing = false; $("#play").textContent = "▶"; $("#play").setAttribute("aria-label", "Play"); }
$("#play").onclick = () => { QK.resumeAfterWave = false; S.playing ? stop() : play(); };
$("#t").oninput = (e) => { stop(); setT(+e.target.value); if (S.fire?.quake) quakeSync(S.T, true); };
$("#speed").onchange = (e) => (S.speed = +e.target.value);
addEventListener("keydown", (e) => { if (e.code === "Space" && S.view === "fire" && !["INPUT", "BUTTON", "SELECT", "SUMMARY"].includes(e.target.tagName)) { e.preventDefault(); S.playing ? stop() : play(); } });

function sourcesHTML() {
  if (!S.sources) return "";
  return `<details><summary>Data sources</summary><ul>${S.sources.map((s) => `<li><a href="${s.home.startsWith("https://") ? esc(s.home) : "#"}" target="_blank" rel="noopener">${esc(s.name)}</a>. ${esc(s.what)} Licence: ${esc(s.licence)}.</li>`).join("")}</ul>
    <p>Full list of downloaded files with dates and checksums: SOURCES.md in the project.</p></details>`;
}

// ---------- boot ----------
try {
  [state, S.sources] = await Promise.all([getJSON("data/state.json"), getJSON("data/sources.json")]);
  const [want, at] = location.hash.slice(1).split("@");     // #ridgecrest@60 opens an event at hour 60
  state.featured.some((f) => f.id === want) || Object.values(EVENTS).flat().some((f) => f.id === want) ? (S.deep = true, await showFire(want)) : await showState(); S.deep = false;
  if (at && S.fire) { setT(Math.min(S.fire.Tmax, parseFloat(at) || 0)); if (S.fire.quake) quakeSync(S.T, true); }
  if (S.fire?.quake && /warn/.test(location.hash)) document.querySelector('input[name="qmode"][value="1"]').click();   // deep link: #ridgecrest@100,warn
  if (S.fire?.drought) {   // deep links: #ca-drought@14000,wells,table,rain,soil|grace
    const h = location.hash;
    for (const [k, id] of [["wells", "#lw"], ["table", "#lt"], ["rain", "#lr"]]) if (h.includes(k)) $(id).click();
    if (h.includes("soil")) document.querySelector('input[name="dmode"][value="1"]').click(); else if (h.includes("grace")) document.querySelector('input[name="dmode"][value="2"]').click();
  }
  frame();
} catch (e) {
  $("#loading").hidden = false; $("#loading").textContent = "Could not load the data: " + e.message;
  console.error(e);
}
</script>
